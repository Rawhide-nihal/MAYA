name: MAYA Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-validation:
    name: Backend & Tool Schema Validation
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python Tree
        run: |
          python -m compileall -q .

      - name: Validate Dataset Tools against Canonical ToolRegistry
        run: |
          python training/datasets/validate_dataset_tools.py

      - name: Validate Runtime Tool Registry
        run: |
          python -c "from maya_core.tools.registry import default_tool_registry; r=default_tool_registry.self_test(require_executors=True); print(r); assert r['all_passed'], r"

      - name: Discover and Run Full Python Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  frontend-validation:
    name: Desktop UI Build & TypeScript Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck and Vite Production Build
        run: npm run build

      - name: Validate MAYA Chrome Extension
        run: |
          node -e "JSON.parse(require('fs').readFileSync('../chrome-extension/manifest.json','utf8')); console.log('manifest ok')"
          node --check ../chrome-extension/background.js
          node --check ../chrome-extension/common.js
          node --check ../chrome-extension/gmail.js
          node --check ../chrome-extension/whatsapp.js
          node --check ../chrome-extension/telegram.js
