name: MAYA Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-validation:
    name: Backend & Tool Schema Validation
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Dataset Tools against Canonical ToolRegistry
        run: |
          python training/datasets/validate_dataset_tools.py

      - name: Run Core Test Suite
        run: |
          python -m unittest tests/test_core.py

      - name: Run Security Integration Test Suite
        run: |
          python -m unittest tests/test_security_integration.py

  frontend-validation:
    name: Desktop UI Build & TypeScript Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck and Vite Production Build
        run: npm run build
